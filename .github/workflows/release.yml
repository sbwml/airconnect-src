name: Build & Release AirConnect Source

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Target AirConnect version (e.g. 1.12.4, leave empty for latest)'
        required: false
        default: ''
      force:
        description: 'Force build and release even if tag already exists'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Check version and compare tags
        id: check
        run: |
          # 1. Determine target version
          INPUT_VER="${{ github.event.inputs.version }}"
          if [ -n "$INPUT_VER" ]; then
            TARGET_VER="$INPUT_VER"
            echo "==> Using manually specified version: $TARGET_VER"
          else
            echo "==> Querying latest release tag from upstream AirConnect..."
            TARGET_VER=$(git ls-remote --tags --sort=-v:refname https://github.com/philippe44/AirConnect.git | awk -F'/' '!/\^\{\}/ {print $3; exit}')
            if [ -z "$TARGET_VER" ]; then
              TARGET_VER=$(curl -sSL "https://api.github.com/repos/philippe44/AirConnect/releases/latest" | grep '"tag_name":' | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
            fi
            echo "==> Upstream latest release version: $TARGET_VER"
          fi

          if [ -z "$TARGET_VER" ]; then
            echo "ERROR: Unable to resolve target version" >&2
            exit 1
          fi

          echo "version=$TARGET_VER" >> "$GITHUB_OUTPUT"

          # 2. Check if tag already exists in this repository
          git fetch --tags || true
          FORCE="${{ github.event.inputs.force }}"

          if (git rev-parse -q --verify "refs/tags/$TARGET_VER" >/dev/null || \
              git rev-parse -q --verify "refs/tags/v$TARGET_VER" >/dev/null) && \
             [ "$FORCE" != "true" ]; then
            echo "==> Tag $TARGET_VER already exists in this repository. Skipping packaging."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "==> Tag $TARGET_VER not found (or forced). Proceeding to package."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package source tarball
        if: steps.check.outputs.skip != 'true'
        run: |
          chmod +x ./airconnect-src-tarball.sh
          ./airconnect-src-tarball.sh "${{ steps.check.outputs.version }}"

      - name: Create Release
        if: steps.check.outputs.skip != 'true'
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{ steps.check.outputs.version }}
          name: AirConnect-${{ steps.check.outputs.version }}
          body: |
            AirConnect ${{ steps.check.outputs.version }} clean source tarball for OpenWrt buildroot.

            - Upstream: https://github.com/philippe44/AirConnect/releases/tag/${{ steps.check.outputs.version }}
            - Stripped of precompiled static archives and binary blobs
            - Dynamic source discovery Makefile included
          files: |
            AirConnect-${{ steps.check.outputs.version }}-src.tar.xz
            AirConnect-${{ steps.check.outputs.version }}-src.tar.xz.sha256
